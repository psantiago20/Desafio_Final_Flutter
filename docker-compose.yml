version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: omniconnect-db
    environment:
      POSTGRES_USER: omniconnect
      POSTGRES_PASSWORD: omniconnect123
      POSTGRES_DB: omniconnect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniconnect"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omniconnect-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://omniconnect:omniconnect123@postgres:5432/omniconnect
      - SECRET_KEY=supersecretkeychangeinproduction
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data: