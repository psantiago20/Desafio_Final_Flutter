services:
  postgres:
    image: postgres:15-alpine
    container_name: omniconnect-db
    restart: always
    environment:
      POSTGRES_USER: omniconnect
      POSTGRES_PASSWORD: omniconnect123
      POSTGRES_DB: omniconnect
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniconnect"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: omniconnect-backend
    restart: on-failure
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://omniconnect:omniconnect123@postgres:5432/omniconnect
      - SECRET_KEY=supersecretkeychangeinproduction
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - DEBUG=True
      - FAQ_DIR=/app/faq
      - CHROMA_DIR=/app/chroma_data
      - GOOGLE_APPLICATION_CREDENTIALS=/app/serviceAccountKey.json
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./backend/faq:/app/faq
      - chroma_data:/app/chroma_data
    # Usamos reload para desenvolvimento local
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  chroma_data: