server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/pitaya_post
    username: pitaya
    password: pitaya
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  rabbitmq:
    host: localhost
    port: 5672
    username: pitaya
    password: pitaya
    virtual-host: /
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api/v1/posts/api-docs
  swagger-ui:
    path: /api/v1/posts/swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.pitaya: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO

post-service:
  rabbitmq:
    queue:
      post-created: post.created
      comment-added: post.comment.added
      post-liked: post.liked
      profile-updated: user.profile.updated
