<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pitaya - Login</title>
  <link rel="stylesheet" href="/frontend/css/reset.css">
  <link rel="stylesheet" href="/frontend/css/themes.css">
  <link rel="stylesheet" href="/frontend/css/main.css">
  <link rel="stylesheet" href="/frontend/css/components.css">
  <link rel="stylesheet" href="/frontend/css/pages/auth.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-logo">Pitaya</div>
        <p class="auth-subtitle">Entre na sua conta</p>
      </div>
      <div class="auth-tabs">
        <div class="auth-tab active" data-tab="login">Entrar</div>
        <div class="auth-tab" data-tab="register">Cadastrar</div>
      </div>
      <form class="auth-form" id="login-form">
        <div class="auth-error" id="auth-error"></div>
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="seu@email.com" required>
        </div>
        <div class="form-group">
          <label for="login-password">Senha</label>
          <input type="password" id="login-password" placeholder="Sua senha" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg">Entrar</button>
        <div class="form-footer">
          <a href="#">Esqueceu sua senha?</a>
        </div>
      </form>
      <form class="auth-form hidden" id="register-form">
        <div class="auth-error" id="register-error"></div>
        <div class="form-group">
          <label for="register-name">Nome completo</label>
          <input type="text" id="register-name" placeholder="Seu nome" required>
        </div>
        <div class="form-group">
          <label for="register-username">Nome de usuário</label>
          <input type="text" id="register-username" placeholder="usuario" required>
        </div>
        <div class="form-group">
          <label for="register-email">Email</label>
          <input type="email" id="register-email" placeholder="seu@email.com" required>
        </div>
        <div class="form-group">
          <label for="register-password">Senha</label>
          <input type="password" id="register-password" placeholder="Mínimo 8 caracteres" required>
        </div>
        <div class="form-group">
          <label for="register-confirm">Confirmar senha</label>
          <input type="password" id="register-confirm" placeholder="Confirme sua senha" required>
        </div>
        <button type="submit" class="btn btn-primary btn-lg">Criar conta</button>
        <div class="form-footer">
          Já tem conta? <a class="switch-tab">Entre aqui</a>
        </div>
      </form>
    </div>
  </div>
  <script>
    document.querySelectorAll('.auth-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const isLogin = tab.dataset.tab === 'login';
        document.getElementById('login-form').classList.toggle('hidden', !isLogin);
        document.getElementById('register-form').classList.toggle('hidden', isLogin);
      });
    });
    document.querySelectorAll('.switch-tab').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const loginTab = document.querySelector('[data-tab="login"]');
        const registerTab = document.querySelector('[data-tab="register"]');
        if (link.closest('#register-form')) {
          registerTab.classList.remove('active');
          loginTab.classList.add('active');
          document.getElementById('login-form').classList.remove('hidden');
          document.getElementById('register-form').classList.add('hidden');
        } else {
          loginTab.classList.remove('active');
          registerTab.classList.add('active');
          document.getElementById('register-form').classList.remove('hidden');
          document.getElementById('login-form').classList.add('hidden');
        }
      });
    });
  </script>
</body>
</html>
