global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "eureka-services"
    metrics_path: /actuator/prometheus
    eureka_sd_configs:
      - server: http://discovery-service:8761/eureka
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__meta_eureka_app_name]
        target_label: application
      - source_labels: [__meta_eureka_app_instance_host_name]
        target_label: instance
      - source_labels: [__meta_eureka_app_instance_metadata_management_port]
        target_label: management_port
      - source_labels: [__address__]
        target_label: instance_address

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "postgres"
    metrics_path: /metrics
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "rabbitmq"
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]
