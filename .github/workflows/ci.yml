---
name: CI Pipeline

"on":
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: pitaya
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: pitaya_test

      RABBITMQ_USER: pitaya
      RABBITMQ_PASSWORD: ${{ secrets.RABBITMQ_PASSWORD }}

    services:
      postgres:
        image: postgres:16-alpine

        env:
          POSTGRES_USER: pitaya
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: pitaya_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U pitaya"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine

        ports:
          - 6379:6379

        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3.13-alpine

        env:
          RABBITMQ_DEFAULT_USER: pitaya
          RABBITMQ_DEFAULT_PASS: ${{ secrets.RABBITMQ_PASSWORD }}

        ports:
          - 5672:5672

        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4

        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4

        with:
          path: ~/.m2/repository

          key: >-
            ${{ runner.os }}-maven-${{
            hashFiles('**/pom.xml')
            }}

          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and run tests
        run: mvn clean verify -B

        env:
          SPRING_DATASOURCE_URL: >-
            jdbc:postgresql://localhost:5432/pitaya_test

          SPRING_DATASOURCE_USERNAME: pitaya

          SPRING_DATASOURCE_PASSWORD: >-
            ${{ secrets.POSTGRES_PASSWORD }}

          SPRING_RABBITMQ_HOST: localhost
          SPRING_RABBITMQ_PORT: 5672
          SPRING_RABBITMQ_USERNAME: pitaya

          SPRING_RABBITMQ_PASSWORD: >-
            ${{ secrets.RABBITMQ_PASSWORD }}

          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379

      - name: Upload test reports
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: test-reports

          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/

  sonar-analysis:
    name: SonarQube Analysis

    needs: build-and-test
    runs-on: ubuntu-latest

    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name ==
      github.repository

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4

        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4

        with:
          path: ~/.m2/repository

          key: >-
            ${{ runner.os }}-maven-${{
            hashFiles('**/pom.xml')
            }}

          restore-keys: |
            ${{ runner.os }}-maven-

      - name: SonarQube Scan
        run: |
          mvn sonar:sonar -B \
            -Dsonar.projectKey=pitaya-social-network \
            -Dsonar.organization=${{ secrets.SONAR_ORG }} \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=**/target/site/jacoco/jacoco.xml

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: Docker Build and Push

    needs: build-and-test
    runs-on: ubuntu-latest

    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'

    strategy:
      matrix:
        service:
          - discovery-service
          - config-service
          - gateway-service
          - services/auth-service
          - services/user-service
          - services/post-service
          - services/group-service
          - services/library-service
          - services/mentorship-service
          - services/gamification-service
          - services/notification-service
          - services/message-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3

        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract service name
        id: service

        run: |
          SERVICE_NAME=$(
            echo "${{ matrix.service }}" |
            sed 's|services/||' |
            sed 's|-service||'
          )

          echo "name=$SERVICE_NAME" >> $GITHUB_OUTPUT

          echo "tag=$(echo ${{ matrix.service }} | tr '/' '-')" \
            >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5

        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile

          platforms: linux/amd64,linux/arm64

          push: true

          tags: |
            ${{ env.REGISTRY }}/${{
              github.repository
            }}/${{
              steps.service.outputs.tag
            }}:${{
              env.IMAGE_TAG
            }}

            ${{ env.REGISTRY }}/${{
              github.repository
            }}/${{
              steps.service.outputs.tag
            }}:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy

    needs: docker-build
    runs-on: ubuntu-latest

    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}

          port: ${{ secrets.DEPLOY_PORT || 22 }}

          script: |
            cd ${{ secrets.DEPLOY_PATH }}

            docker compose pull

            docker compose up -d --remove-orphans

            sleep 30

            docker image prune -f
